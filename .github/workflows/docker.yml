name: Docker

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Образ только собирается и никуда не публикуется: задача проверить,
      # что Dockerfile цел, а не выкладывать непроверенный код.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: docker compose config
        run: docker compose -f docker/docker-compose.yml --profile app config --quiet
