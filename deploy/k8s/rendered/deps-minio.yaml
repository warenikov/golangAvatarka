---
# Source: gophprofile/templates/deps-minio.yaml
# MinIO для локального кластера. Те же оговорки, что и у базы: один экземпляр,
# без избыточности. Бакет заводить не нужно — сервис создаёт его сам при старте.
apiVersion: v1
kind: Service
metadata:
  name: gp-gophprofile-minio
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
  selector:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/component: minio

---
# Source: gophprofile/templates/deps-minio.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gp-gophprofile-minio
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/component: minio
spec:
  serviceName: gp-gophprofile-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: gp
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/instance: gp
        app.kubernetes.io/component: minio
    spec:
      # Зависимости в API-сервер не ходят так же, как и приложение.
      # Смонтированный токен здесь был бы просто лишней точкой опоры.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
          args: ["server", "/data", "--console-address", ":9001"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            # Совпадают с S3_ACCESS_KEY и S3_SECRET_KEY приложения: это одна
            # и та же учётная запись, и разъехаться они не должны.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: gp-gophprofile-secrets
                  key: s3-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gp-gophprofile-secrets
                  key: s3-secret-key
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

