---
# Source: gophprofile/templates/secret.yaml
# Секреты релиза. Ключи совпадают с теми, что читают Deployment и Job.
#
# Это учебный вариант: значения приезжают из values, а значит, живут в истории
# релизов Helm и в том, чем values передаются. Для настоящего продакшена
# задаётся secrets.existingSecret, и Secret заводится снаружи чарта — через
# External Secrets, Sealed Secrets или SOPS. Тогда пароль не проходит
# через values вовсе.
apiVersion: v1
kind: Secret
metadata:
  name: gp-gophprofile-secrets
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
type: Opaque
data:
  db-password: "YXZhdGFycw=="
  s3-access-key: "bWluaW9hZG1pbg=="
  s3-secret-key: "bWluaW9hZG1pbg=="
  # Содержит пароль брокера целиком, поэтому собирается здесь, а не в ConfigMap.
  rabbitmq-url: "YW1xcDovL2d1ZXN0Omd1ZXN0QGdwLWdvcGhwcm9maWxlLXJhYmJpdG1xOjU2NzIv"
  # Тот же пароль отдельным ключом: встроенному брокеру он нужен как есть,
  # а разбирать URL в шаблоне значило бы держать пароль в двух местах.
  rabbitmq-password: "Z3Vlc3Q="

