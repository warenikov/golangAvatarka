---
# Source: gophprofile/templates/worker-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gp-gophprofile-worker
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: gp
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/instance: gp
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: 791e9de3acd36ceb5ccd7696d9e2a53c3d57b2a68b291fdd30efc2c5f2934741
        checksum/secret: be412f70df45471ec28927db94a44f16e6190ec37e050d42aba89c628410dfc9
    spec:
      serviceAccountName: gp-gophprofile
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Воркер не принимает запросов, но держит взятое из очереди сообщение
      # до подтверждения. Времени должно хватить дообработать текущую задачу,
      # иначе она уедет в повторную доставку и миниатюра соберётся дважды.
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: gophprofile:dev
          imagePullPolicy: IfNotPresent
          # В образе три бинаря и точка входа сервера. Воркеру нужна своя.
          command: ["/usr/local/bin/worker"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          ports:
            # Публичного порта у воркера нет вовсе: он потребитель очереди.
            # Служебный нужен — половина бизнес-метрик живёт именно здесь.
            - name: metrics
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gp-gophprofile-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gp-gophprofile-secrets
                  key: db-password
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gp-gophprofile-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gp-gophprofile-secrets
                  key: s3-secret-key
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: gp-gophprofile-secrets
                  key: rabbitmq-url
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 3
            failureThreshold: 30
          # Проверка нужна не балансировщику, а оркестратору: без неё зависший
          # на мёртвом соединении процесс выглядит живым, а очередь молча копится.
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Готовность воркера не управляет трафиком — Service на него не смотрит.
          # Она нужна выкату: без неё обновление считалось бы успешным раньше,
          # чем новый под вообще подключился к брокеру.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 96Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi

