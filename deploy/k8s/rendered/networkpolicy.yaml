# Source: gophprofile/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gp-gophprofile-worker-ingress
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gophprofile
      app.kubernetes.io/instance: gp
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  ingress:
    # Воркер не принимает пользовательского трафика вовсе. Единственный вход —
    # сбор метрик.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081

---
# Source: gophprofile/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gp-gophprofile-app-egress
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
spec:
  # Сервер, воркер и джоб миграций ходят в одни и те же места.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [server, worker, migrate]
  policyTypes:
    - Egress
  egress:
    # Встроенные зависимости живут в этом же неймспейсе и адресуются
    # по лейблам, а не по адресам: адреса подов меняются при каждом рестарте.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gophprofile
              app.kubernetes.io/instance: gp
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gophprofile
              app.kubernetes.io/instance: gp
              app.kubernetes.io/component: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gophprofile
              app.kubernetes.io/instance: gp
              app.kubernetes.io/component: rabbitmq
      ports:
        - protocol: TCP
          port: 5672

---
# Source: gophprofile/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gp-gophprofile-deps-ingress
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
spec:
  # Зависимости принимают только от приложения этого же релиза. Ни другой
  # неймспейс, ни чужой под в этом неймспейсе до них не достучится.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [postgresql, minio, rabbitmq]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [server, worker, migrate]

