---
# Source: gophprofile/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gp-gophprofile
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: "avatars.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gp-gophprofile-server
                # Только публичный порт. Служебный остаётся внутри кластера:
                # маршрут на него означал бы открытые наружу метрики.
                port:
                  name: http

