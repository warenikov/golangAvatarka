          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 40
          },
          "targets": [
            {
              "expr": "max by (pod, dependency) (circuit_breaker_state{namespace=\"$namespace\"})",
              "legendFormat": "{{dependency}} · {{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "options": {
            "showValue": "never",
            "mergeValues": true
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
