---
# Source: gophprofile/templates/grafana-dashboards.yaml
# Дашборды для Grafana. Сайдкар kube-prometheus-stack подбирает ConfigMap
# по лейблу и раскладывает содержимое в каталог дашбордов — провижининг
# через файлы, как в compose, в кластере не работает: файловой системы,
# общей с Grafana, здесь нет.
#
# overview.json — копия docker/observability/grafana/dashboards: Helm читает
# только то, что лежит внутри каталога чарта, снаружи ему файлы недоступны.
# Копию обновляет `make k8s-render`, чтобы два контура не разъезжались.
#
# cluster.json есть только здесь: он строится на kube-state-metrics,
# которых в compose нет. CPU и память сервера и воркера берутся из метрик
# самого процесса, а не из cAdvisor — kubelet OrbStack контейнерных
# метрик не отдаёт, и панели на них остались бы пустыми.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gp-gophprofile-dashboards
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
    grafana_dashboard: "1"
data:
  cluster.json: |
    {
      "uid": "gophprofile-cluster",
      "title": "GophProfile — кластер",
      "description": "Состояние релиза в Kubernetes: поды, реплики и HPA, ресурсы относительно лимитов, балансировка между репликами, выключатели зависимостей.",
      "tags": [
        "gophprofile",
        "kubernetes"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0
          },
          {
            "name": "namespace",
            "label": "Неймспейс",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(kube_pod_info, namespace)",
            "current": {
              "text": "gophprofile",
              "value": "gophprofile"
            },
            "refresh": 1,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Состояние",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "title": "Поды Running",
          "type": "stat",
          "description": "Поды неймспейса в фазе Running.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"$namespace\", phase=\"Running\"})",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Поды не готовы",
          "type": "stat",
          "description": "Работающие поды, не прошедшие пробу готовности: они выведены из балансировки.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"$namespace\", condition=\"false\"} * on (pod) group_left kube_pod_status_phase{namespace=\"$namespace\", phase=\"Running\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Реплики сервера",
          "type": "stat",
          "description": "Доступные реплики сервера: столько подов сейчас принимают трафик.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"$namespace\", deployment=~\".+-server\"})",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Рестарты за час",
          "type": "stat",
          "description": "Перезапуски контейнеров неймспейса за последний час.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[1h]))",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Цели Prometheus",
          "type": "stat",
          "description": "Доля подов сервера и воркера, с которых снимаются метрики.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(up{namespace=\"$namespace\", component=~\"server|worker\"}) / count(up{namespace=\"$namespace\", component=~\"server|worker\"})",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "Разомкнутые выключатели",
          "type": "stat",
          "description": "Зависимости, обращения к которым сейчас отклоняются.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "expr": "count(circuit_breaker_state{namespace=\"$namespace\"} == 2) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Масштабирование",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 9,
          "title": "Автомасштабирование сервера",
          "type": "timeseries",
          "description": "Текущее и желаемое число реплик относительно границ HPA.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "expr": "sum(kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\"})",
              "legendFormat": "текущие",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "sum(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"$namespace\"})",
              "legendFormat": "желаемые",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "sum(kube_horizontalpodautoscaler_spec_min_replicas{namespace=\"$namespace\"})",
              "legendFormat": "минимум",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "sum(kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\"})",
              "legendFormat": "максимум",
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "минимум|максимум"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 10,
          "title": "Готовые реплики",
          "type": "timeseries",
          "description": "Готовые реплики каждого Deployment и StatefulSet релиза.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"$namespace\"}",
              "legendFormat": "{{deployment}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "kube_statefulset_status_replicas_ready{namespace=\"$namespace\"}",
              "legendFormat": "{{statefulset}}",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "title": "Поды по фазам",
          "type": "timeseries",
          "description": "Сколько подов в каждой фазе: Pending дольше минуты — нехватка ресурсов или проблема с образом.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "expr": "sum by (phase) (kube_pod_status_phase{namespace=\"$namespace\"}) > 0",
              "legendFormat": "{{phase}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "title": "Рестарты контейнеров",
          "type": "timeseries",
          "description": "Перезапуски за 15 минут по подам. Постоянные рестарты — проба живости или OOMKilled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[15m])) > 0",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "row",
          "title": "Ресурсы сервера и воркера",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "id": 14,
          "title": "CPU по подам",
          "type": "timeseries",
          "description": "Потребление процессора процессом приложения и запрос контейнера (пунктир). Лимита CPU нет намеренно: он троттлит процесс даже на свободном узле.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(process_cpu_seconds_total{namespace=\"$namespace\", component=~\"server|worker\"}[2m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=\"$namespace\", resource=\"cpu\", container=~\"server|worker\"})",
              "legendFormat": "запрос {{pod}}",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "запрос.*"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 15,
          "title": "Память по подам",
          "type": "timeseries",
          "description": "Резидентная память процесса и лимит контейнера (пунктир). Упор в лимит кончается OOMKilled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "targets": [
            {
              "expr": "sum by (pod) (process_resident_memory_bytes{namespace=\"$namespace\", component=~\"server|worker\"})",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\", resource=\"memory\", container=~\"server|worker\"})",
              "legendFormat": "лимит {{pod}}",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "лимит.*"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 16,
          "title": "Загрузка относительно ресурсов",
          "type": "timeseries",
          "description": "CPU — доля от requests, её же сравнивает с целью HPA. Память — доля от лимита: при 100% контейнер убивается OOMKilled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(process_cpu_seconds_total{namespace=\"$namespace\", component=~\"server|worker\"}[2m])) / sum by (pod) (kube_pod_container_resource_requests{namespace=\"$namespace\", resource=\"cpu\"})",
              "legendFormat": "CPU {{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            },
            {
              "expr": "sum by (pod) (process_resident_memory_bytes{namespace=\"$namespace\", component=~\"server|worker\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\", resource=\"memory\"})",
              "legendFormat": "RAM {{pod}}",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          }
        },
        {
          "id": 17,
          "title": "Горутины",
          "type": "timeseries",
          "description": "Число горутин по подам: неуклонный рост — утечка.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 31
          },
          "targets": [
            {
              "expr": "sum by (pod) (go_goroutines{namespace=\"$namespace\", component=~\"server|worker\"})",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          }
        },
        {
          "id": 18,
          "type": "row",
          "title": "Балансировка и зависимости",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 39
          },
          "panels": []
        },
        {
          "id": 19,
          "title": "Запросы по репликам сервера",
          "type": "timeseries",
          "description": "Как Service раскладывает трафик по подам сервера: при исправной балансировке линии идут рядом.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(http_requests_total{namespace=\"$namespace\", component=\"server\"}[1m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 20,
          "title": "Доля запросов по репликам",
          "type": "piechart",
          "description": "Распределение запросов за выбранный период между подами сервера.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 40
          },
          "targets": [
            {
              "expr": "sum by (pod) (increase(http_requests_total{namespace=\"$namespace\", component=\"server\"}[$__range]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "pieType": "donut",
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "values": [
                "percent"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 21,
          "title": "Выключатели зависимостей",
          "type": "state-timeline",
          "description": "Состояние выключателей Postgres, S3 и брокера в каждом поде.",
