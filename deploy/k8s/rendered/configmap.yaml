---
# Source: gophprofile/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gp-gophprofile-config
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
# Всё, что не является секретом. Конфигурация сервиса целиком лежит
# в переменных окружения и проверяется на старте, поэтому ConfigMap
# подключается через envFrom — перечислять то же самое в env было бы
# вторым местом, где список переменных расходится с кодом.
data:
  APP_ENV: "dev"
  APP_LOG_LEVEL: "debug"
  APP_VERSION: "0.3.0"
  APP_HTTP_ADDR: ":8080"
  APP_ADMIN_ADDR: ":8081"
  APP_REQUEST_TIMEOUT: "60s"
  APP_SHUTDOWN_TIMEOUT: "10s"
  APP_DRAIN_DELAY: "8s"
  # Схему накатывает Job-хук до выката подов. Реплика, меняющая схему
  # при старте, — гонка тем вероятнее, чем больше реплик.
  APP_AUTO_MIGRATE: "false"
  # int64 обязателен: Helm разбирает числа из values как float64, и 10485760
  # доезжает до контейнера строкой "1.048576e+07", которую конфиг не принимает.
  APP_MAX_UPLOAD_BYTES: "10485760"
  APP_MAX_IMAGE_PIXELS: "50000000"
  APP_ALLOWED_MIME: "image/jpeg,image/png,image/webp"
  APP_CORS_ORIGINS: "http://avatars.local,http://127.0.0.1:8080"
  APP_RATE_LIMIT_RPM: "300"
  APP_RATE_LIMIT_UPLOAD_RPM: "10"
  APP_TRUSTED_PROXY_CIDRS: "10.42.0.0/16,192.168.194.0/24"

  DB_HOST: "gp-gophprofile-postgresql"
  DB_PORT: "5432"
  DB_USER: "avatars"
  DB_NAME: "avatars"
  # Внутри кластера трафик до встроенной базы не выходит за пределы неймспейса,
  # и TLS там нечем терминировать. Внешняя база — только по require.
  DB_SSLMODE: "disable"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"

  S3_ENDPOINT: "gp-gophprofile-minio:9000"
  S3_BUCKET: "avatars"
  S3_REGION: "us-east-1"
  S3_USE_SSL: "false"

  RABBITMQ_EXCHANGE: "avatars.exchange"
  RABBITMQ_QUEUE_PROCESS: "avatars.process"
  RABBITMQ_QUEUE_DELETE: "avatars.delete"
  RABBITMQ_QUEUE_RETRY: "avatars.retry"
  RABBITMQ_QUEUE_DEAD: "avatars.dead"
  RABBITMQ_RETRY_TTL: "30s"
  RABBITMQ_MAX_RETRIES: "5"
  RABBITMQ_PREFETCH: "4"

  WORKER_ADMIN_ADDR: ":8081"
  WORKER_RECONCILE_INTERVAL: "1m"
  WORKER_RECONCILE_AGE: "5m"

  TRACING_ENABLED: "false"
  TRACING_ENDPOINT: ""
  TRACING_SAMPLE_RATIO: "0.1"

