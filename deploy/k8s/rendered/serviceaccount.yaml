---
# Source: gophprofile/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gp-gophprofile
  namespace: gophprofile
  labels:
    helm.sh/chart: gophprofile-0.1.0
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gp
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gophprofile
# Приложение не обращается к API-серверу. Смонтированный токен при этом остаётся
# действующим доступом к API от имени этой учётной записи — любой, кто получил
# выполнение кода в поде, получил бы и его. Отсутствие токена и есть минимум прав.
automountServiceAccountToken: false

