{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gophprofile.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
# Приложение не обращается к API-серверу. Смонтированный токен при этом остаётся
# действующим доступом к API от имени этой учётной записи — любой, кто получил
# выполнение кода в поде, получил бы и его. Отсутствие токена и есть минимум прав.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
