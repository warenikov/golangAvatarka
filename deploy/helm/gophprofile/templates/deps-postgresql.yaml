{{- if .Values.postgresql.enabled }}
# PostgreSQL для локального кластера.
#
# Это намеренно минимальный вариант: один экземпляр, без репликации, резервных
# копий и настройки параметров. Он существует, чтобы `helm install` поднимал
# рабочий контур одной командой. В продакшене postgresql.enabled=false,
# и база приезжает снаружи — через оператора или управляемый сервис.
#
# Чарты Bitnami сознательно не используются: с осени 2025 их образы уехали
# в платный каталог, и зависимость, которая перестанет ставиться к моменту
# проверки, дороже трёх десятков строк своего манифеста.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    {{- include "gophprofile.componentSelectorLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gophprofile.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ include "gophprofile.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "gophprofile.componentSelectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gophprofile.componentSelectorLabels" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      # Зависимости в API-сервер не ходят так же, как и приложение.
      # Смонтированный токен здесь был бы просто лишней точкой опоры.
      automountServiceAccountToken: false
      securityContext:
        # Пользователь postgres в официальном образе. fsGroup нужен, чтобы том
        # оказался доступен на запись процессу без прав root: без него initdb
        # падает на создании каталога данных.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: db-password
            # Подкаталог, а не корень тома: на корне смонтированного тома
            # у части провайдеров лежит lost+found, и initdb отказывается
            # работать в непустом каталоге.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
{{- end }}
