{{- if .Values.minio.enabled }}
# MinIO для локального кластера. Те же оговорки, что и у базы: один экземпляр,
# без избыточности. Бакет заводить не нужно — сервис создаёт его сам при старте.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
  selector:
    {{- include "gophprofile.componentSelectorLabels" (dict "root" . "component" "minio") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gophprofile.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  serviceName: {{ include "gophprofile.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "gophprofile.componentSelectorLabels" (dict "root" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gophprofile.componentSelectorLabels" (dict "root" . "component" "minio") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            # Совпадают с S3_ACCESS_KEY и S3_SECRET_KEY приложения: это одна
            # и та же учётная запись, и разъехаться они не должны.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: s3-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gophprofile.secretName" . }}
                  key: s3-secret-key
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.minio.storage.size }}
{{- end }}
