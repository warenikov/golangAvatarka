{{- if not .Values.secrets.existingSecret }}
# Секреты релиза. Ключи совпадают с теми, что читают Deployment и Job.
#
# Это учебный вариант: значения приезжают из values, а значит, живут в истории
# релизов Helm и в том, чем values передаются. Для настоящего продакшена
# задаётся secrets.existingSecret, и Secret заводится снаружи чарта — через
# External Secrets, Sealed Secrets или SOPS. Тогда пароль не проходит
# через values вовсе.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ required "secrets.dbPassword обязателен, если не задан secrets.existingSecret" .Values.secrets.dbPassword | b64enc | quote }}
  s3-access-key: {{ required "secrets.s3AccessKey обязателен, если не задан secrets.existingSecret" .Values.secrets.s3AccessKey | b64enc | quote }}
  s3-secret-key: {{ required "secrets.s3SecretKey обязателен, если не задан secrets.existingSecret" .Values.secrets.s3SecretKey | b64enc | quote }}
  # Содержит пароль брокера целиком, поэтому собирается здесь, а не в ConfigMap.
  rabbitmq-url: {{ include "gophprofile.rabbitmqURL" . | b64enc | quote }}
  {{- if .Values.rabbitmq.enabled }}
  # Тот же пароль отдельным ключом: встроенному брокеру он нужен как есть,
  # а разбирать URL в шаблоне значило бы держать пароль в двух местах.
  rabbitmq-password: {{ required "rabbitmq.auth.password обязателен при rabbitmq.enabled=true" .Values.rabbitmq.auth.password | b64enc | quote }}
  {{- end }}
{{- end }}
