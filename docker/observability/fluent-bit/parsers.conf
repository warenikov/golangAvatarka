# Docker заворачивает вывод контейнера в свой JSON, внутри которого лежит
# наша строка лога — тоже JSON. Отсюда два разбора подряд.
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name        applog
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
