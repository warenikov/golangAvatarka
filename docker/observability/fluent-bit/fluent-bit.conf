# Логи читаются из файлов json-file драйвера, а не через forward-драйвер:
# при forward вывод контейнера перестаёт попадать в `docker compose logs`,
# и обычная отладка ломается ради индексации.
[SERVICE]
    Flush             1
    Daemon            Off
    Log_Level         info
    Parsers_File      parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Refresh_Interval  5
    Skip_Long_Lines   On
    Mem_Buf_Limit     16MB
    # Позиция чтения переживает перезапуск: иначе после каждого restart
    # весь накопленный лог заливается в индекс заново.
    DB                /var/lib/fluent-bit/pos.db

[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            applog
    Reserve_Data      On

# Наши процессы всегда пишут поле service. По нему и отбираем: тащить
# в индекс логи postgres, minio и самого стека наблюдаемости незачем.
[FILTER]
    Name              grep
    Match             docker.*
    Regex             service ^(server|worker|migrate)$

[FILTER]
    Name              record_modifier
    Match             docker.*
    Record            source docker

[OUTPUT]
    Name              opensearch
    Match             docker.*
    Host              opensearch
    Port              9200
    Suppress_Type_Name On
    Index             gophprofile-logs
    Logstash_Format   On
    Logstash_Prefix   gophprofile-logs
    Logstash_DateFormat %Y.%m.%d
    Time_Key          @timestamp
    Generate_ID       On
    Replace_Dots      On
    Retry_Limit       5
