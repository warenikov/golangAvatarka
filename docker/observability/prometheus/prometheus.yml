# Сбор метрик сервиса. Цели заданы статически: в compose имена контейнеров
# стабильны, а service discovery здесь только добавил бы движущихся частей.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    service: gophprofile

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# Оба процесса отдают метрики на служебном порту 8081, а не на публичном:
# в метках метрик лежит внутреннее устройство сервиса, и на порту, который
# смотрит наружу, им не место. У воркера публичного порта нет вовсе, но
# половина бизнес-метрик — обработка миниатюр, ретраи — живёт именно в нём.
scrape_configs:
  - job_name: server
    static_configs:
      - targets: [server:8081]
        labels:
          component: server

  - job_name: worker
    static_configs:
      - targets: [worker:8081]
        labels:
          component: worker

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
