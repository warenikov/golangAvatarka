# Сбор метрик сервиса. Цели заданы статически: в compose имена контейнеров
# стабильны, а service discovery здесь только добавил бы движущихся частей.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    service: gophprofile

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: server
    static_configs:
      - targets: [server:8080]
        labels:
          component: server

  # У воркера отдельный служебный порт: он не принимает пользовательский
  # трафик, но половина бизнес-метрик живёт именно в нём.
  - job_name: worker
    static_configs:
      - targets: [worker:8081]
        labels:
          component: worker

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
